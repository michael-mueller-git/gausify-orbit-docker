server {
    listen 80;
    root /usr/share/nginx/html;

    # WASM + OPFS/SharedArrayBuffer need cross-origin isolation.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy cross-origin always;

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # nginx's default mime.types already maps .wasm → application/wasm.

    location /models/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        # Large static files; let the browser stream+cache them.
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
